name: Claude Code Review

# One review per PR, when it opens or leaves draft -- not on every push. Runs draw on the
# Claude subscription and this repo opens many PRs a day; for another pass, comment @claude
# (claude.yml). Not a required check: /review (review-gate.yml) still gates merges. See #1386.
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  claude-review:
    # Skip drafts (ready_for_review reviews them later) and fork PRs, which get no secrets
    # on this public repo, so the run could only fail.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

