name: Staging

# Fires on every PR push targeting main.
# Pipeline: [preflight] → terraform staging → build images → deploy staging →
#           staging integration tests → report status (PR comment)
#
# Production is NOT touched by this workflow — production deploys only via deploy.yml
# on push to main. The structural separation (two trigger files) is the primary
# production-safety guarantee. See docs/adr/ for rationale.
#
# Required GitHub repository secrets (must already be set for staging to function):
#   GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER
#   GCP_STAGING_SERVICE_ACCOUNT
#   TF_STATE_BUCKET
#   GCP_BILLING_ACCOUNT
#
# Required GitHub repository variables:
#   GCP_STAGING_PROJECT_ID
#
# Environment-level secrets (Settings → Environments → staging → Environment secrets):
#   STAGING_CLERK_TEST_EMAIL     — email of the dedicated Clerk test account
#   STAGING_CLERK_TEST_PASSWORD  — password of the dedicated Clerk test account
#
# If GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER is not set, all jobs are skipped cleanly.

on:
  pull_request:
    branches:
      - main
  # Required so this workflow's checks re-validate merge-queue entries, not just
  # PR pushes — see #694 / #673. checks_requested is the only supported type.
  merge_group:
    types:
      - checks_requested

# Cancel superseded builds for the same PR; do NOT cancel running deploys
# (see staging-deploy-mutex job-level concurrency for that).
# merge_group has no PR number, so fall back to the merge-group head SHA — unique
# per queue entry. Without this fallback every queue entry would share the literal
# group "staging-pr-", recreating the same cross-entry cancellation this fixes (#673).
concurrency:
  group: staging-pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

env:
  REGISTRY: us-central1-docker.pkg.dev
  ARTIFACT_REPO: lifting-logbook
  REGION: us-central1
  TF_DIR: infra/terraform

jobs:
  # ── 0. Preflight: detect whether staging is configured ────────────────────
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      ar_repo: ${{ steps.check.outputs.ar_repo }}
      image_affecting: ${{ steps.filter.outputs.image_affecting }}
    steps:
      - id: check
        env:
          STAGING_WIF: ${{ secrets.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [[ -n "$STAGING_WIF" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Staging credentials found — full pipeline will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER not set — skipping staging pipeline."
          fi

      # dorny/paths-filter uses the GitHub API to diff pull_request events (no
      # checkout needed) but needs a real git checkout + explicit base for any
      # other event, including merge_group (#694). Scoped to merge_group only —
      # pull_request needs no checkout at all per the action's own docs, so
      # this avoids paying a full-history fetch on every ordinary PR push.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Classify the PR diff: image_affecting=false only when every changed file
      # matches one of the skip patterns below. Anything else (including
      # package.json, lockfiles, Dockerfiles, app/package source) forces rebuild.
      # `.github/**` is intentionally NOT in the skip list — workflow changes
      # can affect build context and should rebuild to be safe.
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          filters: |
            image_affecting:
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'
              - '!sessions/**'
              - '!ROADMAP.md'
              - '!**/__tests__/**'
              - '!**/*.test.ts'
              - '!**/*.test.tsx'
              - '!**/*.spec.ts'
              - '!**/*.spec.tsx'
              - '!**/tests/**'
              - '!e2e/**'
              - '!infra/terraform/**'
              - '!infra/kubernetes/**'

  # ── 1. Terraform: staging ─────────────────────────────────────────────────
  terraform-staging:
    name: Terraform (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      gke_enabled: ${{ steps.tf-outputs.outputs.gke_enabled }}
      gke_cluster_name: ${{ steps.tf-outputs.outputs.gke_cluster_name }}
      cloud_run_api_url: ${{ steps.tf-outputs.outputs.cloud_run_api_url }}
      cloud_run_web_url: ${{ steps.tf-outputs.outputs.cloud_run_web_url }}
      ar_repo: ${{ steps.tf-outputs.outputs.ar_repo }}
      kms_key_name: ${{ steps.tf-outputs.outputs.kms_key_name }}
      api_wi_sa: ${{ steps.tf-outputs.outputs.api_wi_sa }}
      web_workload_sa: ${{ steps.tf-outputs.outputs.web_workload_sa }}
      otel_mirror_repo: ${{ steps.tf-outputs.outputs.otel_mirror_repo }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to GCP (staging)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_SERVICE_ACCOUNT }}

      - name: Terraform setup + init (staging)
        uses: ./.github/actions/tf-init
        with:
          workspace: staging
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}

      - name: Terraform apply (staging)
        working-directory: ${{ env.TF_DIR }}
        # Bounded retry absorbs transient GCP API 5xx / eventual-consistency
        # during apply (a real staging red-run driver per the #498 diagnosis —
        # see docs/runbooks/staging-ci-flakiness.md). terraform apply is
        # re-runnable; a genuine config error fails both attempts and hard-fails.
        run: |
          for attempt in 1 2; do
            if terraform apply -auto-approve \
                 -var-file=terraform.tfvars.staging \
                 -var="billing_account=${{ secrets.GCP_BILLING_ACCOUNT }}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 2 ]; then
              echo "Terraform apply attempt ${attempt} failed; retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error title=Terraform apply failed::terraform apply (staging) failed on both attempts."
          exit 1

      - name: Capture Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "gke_enabled=$(terraform output -raw gke_enabled)" >> "$GITHUB_OUTPUT"
          echo "gke_cluster_name=$(terraform output -raw gke_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "cloud_run_api_url=$(terraform output -raw cloud_run_api_url)" >> "$GITHUB_OUTPUT"
          echo "cloud_run_web_url=$(terraform output -raw cloud_run_web_url)" >> "$GITHUB_OUTPUT"
          echo "ar_repo=$(terraform output -raw artifact_registry_repo)" >> "$GITHUB_OUTPUT"
          echo "kms_key_name=$(terraform output -raw kms_key_name)" >> "$GITHUB_OUTPUT"
          echo "api_wi_sa=$(terraform output -raw cicd_service_account_email)" >> "$GITHUB_OUTPUT"
          echo "web_workload_sa=$(terraform output -raw web_workload_sa)" >> "$GITHUB_OUTPUT"
          echo "otel_mirror_repo=$(terraform output -raw otel_collector_mirror_repo)" >> "$GITHUB_OUTPUT"

  # ── 2. Build and push Docker images ──────────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [preflight, terraform-staging]
    # merge_group has no pull_request context, so the fork-repo check is
    # skipped for it — merge-queue entries are always same-repo branches per
    # GitHub's merge-queue design, and this repo has no fork-PR contribution
    # pattern in practice (#694).
    if: |
      needs.preflight.outputs.should_run == 'true' &&
      (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.terraform-staging.result == 'success' || needs.terraform-staging.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    outputs:
      ar_repo: ${{ steps.ar.outputs.repo }}
      image_tag: ${{ steps.image-tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v5

      # Decide whether to rebuild or reuse a prior image.
      #
      # Reuse is only chosen when the diff is non-image-affecting AND a prior
      # successful staging run exists on this PR. When reusing, image_tag is set
      # to the floating tag `pr-<N>` (which the build step below stamps onto
      # every built image alongside `:<sha>`). The floating tag is the only
      # reuse target that is guaranteed to point at an actually-pushed image:
      #
      # Using the prior run's headSha breaks after the second consecutive skip
      # run, because that run's headSha is a commit at which *no image was
      # built* — its own deploy reused an earlier SHA's image. Walking back the
      # run list to find a non-skip run is brittle (job outputs aren't queryable
      # via gh api), and re-tagging in Artifact Registry adds operational
      # surface. The floating tag avoids all three failure modes at the cost of
      # the SHA-as-image-tag invariant on skip runs only.
      #
      # Corollary (#671): on a skip run, the reused image's baked-in GIT_SHA
      # build-arg — surfaced via GET /version — reflects whichever earlier
      # commit in this PR actually triggered the last real build, not the
      # current head SHA. This is the same pre-existing tag/content mismatch
      # above, just now visible through a human-facing endpoint rather than
      # only the image tag.
      #
      # On cold start (skip-eligible diff, no prior successful run on this PR),
      # we fall through to a fresh build — see issue #358 cold-start discussion.
      - name: Resolve image tag
        id: image-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # No stable PR-branch floating tag exists for a merge-queue entry —
            # always rebuild fresh, tagged with the merge group's head SHA (#694).
            # Fail fast rather than fall through to a malformed (empty) Docker
            # tag two steps downstream if this field ever resolves empty.
            MERGE_GROUP_SHA="${{ github.event.merge_group.head_sha }}"
            if [[ -z "$MERGE_GROUP_SHA" ]]; then
              echo "::error::github.event.merge_group.head_sha resolved empty — cannot tag image. See ADR-030's Escalation trigger."
              exit 1
            fi
            echo "image_tag=$MERGE_GROUP_SHA" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "merge_group event — building fresh (no floating tag reuse)."
            exit 0
          fi
          if [[ "${{ needs.preflight.outputs.image_affecting }}" == "false" ]]; then
            # --branch is a ref filter, not a PR filter. Branch reuse across
            # closed PRs could surface stale runs; the per-session unique
            # `claude/<slug>` naming convention makes this effectively impossible
            # in practice, and the floating-tag fallback below would still point
            # at a real image even if it happened.
            PREV_RUN=$(gh run list \
              --branch "${{ github.event.pull_request.head.ref }}" \
              --workflow staging.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // ""')
            if [[ -n "$PREV_RUN" ]]; then
              FLOATING_TAG="pr-${{ github.event.pull_request.number }}"
              echo "image_tag=$FLOATING_TAG" >> "$GITHUB_OUTPUT"
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
              echo "Diff is non-image-affecting — reusing floating tag: $FLOATING_TAG (prior run id: $PREV_RUN)"
              exit 0
            fi
            echo "Diff is non-image-affecting but no prior successful run found — building fresh."
          fi
          echo "image_tag=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          echo "skip_build=false" >> "$GITHUB_OUTPUT"

      # GUARD-DISCIPLINE: every step below `Resolve image tag` except `Resolve
      # Artifact Registry repo` (which only echoes a pre-resolved value into a
      # step output and is needed by downstream consumers) must carry
      #   if: steps.image-tag.outputs.skip_build != 'true'
      # Adding a step without that guard breaks the skip-build optimization
      # silently for that step. If you add a step here, copy the guard from a
      # neighboring step.
      - name: Authenticate to GCP (staging)
        if: steps.image-tag.outputs.skip_build != 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_SERVICE_ACCOUNT }}

      - name: Resolve Artifact Registry repo
        id: ar
        run: echo "repo=${{ needs.terraform-staging.outputs.ar_repo }}" >> "$GITHUB_OUTPUT"

      # No web-image API-URL / Clerk-key resolution: public config is injected at
      # RUNTIME by the Cloud Run web deploy below, not baked into the bundle at build
      # time (#396 / ADR-028). The web image builds once and is env-agnostic.
      - name: Configure Docker for Artifact Registry
        if: steps.image-tag.outputs.skip_build != 'true'
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        if: steps.image-tag.outputs.skip_build != 'true'
        uses: docker/setup-buildx-action@v3

      # Bounded retry (Wandalen/wretry.action, pinned to v3.8.0 SHA) wraps the
      # build+push to absorb transient Artifact Registry 504s on layer-blob push
      # — the dominant real staging red-run driver per the #498 diagnosis (the
      # workflow's own prereq-guard hints already named "Artifact Registry 504 on
      # layer-blob push"). Cached layers make a push-retry cheap. The wrapped
      # docker/build-push-action@v6 config is unchanged; tags are comma-separated
      # to keep wretry's forwarded `with` a flat parse. See
      # docs/runbooks/staging-ci-flakiness.md.
      - name: Build and push API image
        if: steps.image-tag.outputs.skip_build != 'true'
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea  # v3.8.0
        with:
          action: docker/build-push-action@v6
          attempt_limit: 3
          attempt_delay: 15000
          # Per-image cache scope (#407). Isolates the PR-branch API build
          # from the deploy.yml main-branch API cache, mirroring the web scoping.
          with: |
            context: .
            file: apps/api/Dockerfile
            push: true
            tags: ${{ steps.ar.outputs.repo }}/api:${{ steps.image-tag.outputs.image_tag }}${{ github.event_name == 'pull_request' && format(',{0}/api:pr-{1}', steps.ar.outputs.repo, github.event.pull_request.number) || '' }}
            build-args: |
              GIT_SHA=${{ steps.image-tag.outputs.image_tag }}
            cache-from: type=gha,scope=api-pr-v2
            cache-to: type=gha,scope=api-pr-v2,mode=max

      - name: Build and push web image
        if: steps.image-tag.outputs.skip_build != 'true'
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea  # v3.8.0
        with:
          action: docker/build-push-action@v6
          attempt_limit: 3
          attempt_delay: 15000
          # Scoped cache (#407). Isolates PR-branch builds from the deploy.yml
          # main-branch web caches so a stale layer in one workflow cannot
          # silently poison the other. No NEXT_PUBLIC_*-style build-args for
          # public config (injected at runtime, #396/ADR-028) — GIT_SHA IS
          # passed as a build-arg (#671), since it's a build-invariant fact,
          # not environment config.
          with: |
            context: .
            file: apps/web/Dockerfile
            push: true
            tags: ${{ steps.ar.outputs.repo }}/web:${{ steps.image-tag.outputs.image_tag }}${{ github.event_name == 'pull_request' && format(',{0}/web:pr-{1}', steps.ar.outputs.repo, github.event.pull_request.number) || '' }}
            build-args: |
              GIT_SHA=${{ steps.image-tag.outputs.image_tag }}
            cache-from: type=gha,scope=web-pr-v2
            cache-to: type=gha,scope=web-pr-v2,mode=max

  # ── 3a. Deploy API (staging) ──────────────────────────────────────────────
  # Split into per-service jobs so they run in parallel within a single PR.
  # Cross-PR serialization is preserved per-service via separate mutex groups —
  # two PRs cannot race the same Cloud Run service or Helm release, but PR #1's
  # API deploy may overlap with PR #2's web deploy (disjoint targets, safe).
  deploy-api:
    name: Deploy API (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, terraform-staging, build-images]
    if: |
      needs.preflight.outputs.should_run == 'true' &&
      needs.build-images.result == 'success'
    permissions:
      contents: read
      id-token: write
    environment: staging
    concurrency:
      group: staging-deploy-mutex-api
      cancel-in-progress: false
    outputs:
      clerk_configured: ${{ steps.clerk-check.outputs.configured }}
      cloud_run_api_deployed: ${{ steps.deploy-api.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to GCP (staging)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_SERVICE_ACCOUNT }}

      # ── Database migrations (ADR-027) ──────────────────────────────────────
      # Apply pending Prisma migrations to the staging DB via the in-VPC Cloud
      # Run Job (created by terraform-staging) before the API revision goes live,
      # so staging exercises the same migrate path as prod (#460). Terraform
      # applies a placeholder image, so set the real image, then execute + wait.
      #
      # This step previously carried continue-on-error against an assumed
      # "staging Cloud SQL connectivity flakiness". The #498 diagnosis
      # (gcloud telemetry, 2026-06-10) found NO such flakiness: 0 migrate
      # task-failures across 46 runs, all recent API revisions healthy, and no
      # connection-exhaustion/auth/timeout errors in Cloud SQL logs. The only
      # DB-side error class observed is schema drift (`relation … does not exist`)
      # — exactly what continue-on-error would MASK. So the masking is removed:
      # a bounded retry absorbs the rare transient blip (prisma migrate deploy is
      # idempotent), and a genuine migration failure now hard-fails the deploy.
      # See docs/runbooks/staging-ci-flakiness.md and ADR-027.
      - name: Run database migrations (staging)
        id: migrate
        run: |
          # Bounded retry covering BOTH the job-image update and the execute:
          # each is idempotent (same image ref; idempotent migrate deploy), so a
          # transient blip on either call succeeds on retry, while a genuine
          # failure exhausts all attempts and hard-fails (no masking).
          for attempt in 1 2 3; do
            if gcloud run jobs update lifting-logbook-stg-migrate \
                 --image="${{ needs.build-images.outputs.ar_repo }}/api:${{ needs.build-images.outputs.image_tag }}" \
                 --region="${{ env.REGION }}" \
                 --project="${{ vars.GCP_STAGING_PROJECT_ID }}" \
                 --quiet \
               && gcloud run jobs execute lifting-logbook-stg-migrate \
                 --region="${{ env.REGION }}" \
                 --project="${{ vars.GCP_STAGING_PROJECT_ID }}" \
                 --wait; then
              echo "Migrate succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Migrate attempt ${attempt} failed; retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            fi
          done
          echo "::error title=Staging migration failed::The in-VPC Prisma migrate job exited non-zero on all 3 attempts. This is a genuine migration/schema failure, not transient flakiness (#498 diagnosis). See ADR-027 and docs/runbooks/staging-ci-flakiness.md."
          exit 1

      - name: Set up GKE credentials
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ needs.terraform-staging.outputs.gke_cluster_name }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_STAGING_PROJECT_ID }}

      - name: Set up Helm
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        uses: azure/setup-helm@v4

      - name: Ensure staging namespace
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync API secrets to Kubernetes
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        run: |
          DB_URL=$(gcloud secrets versions access latest \
            --secret="lifting-logbook-stg-database-url" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}")
          # system-database-url is no longer synced into the cluster Secret (#534):
          # the owner/superuser cred is unused on the runtime Prisma path, so it is
          # kept out of the GKE runtime surface entirely, not just the pod env.
          CLERK_KEY=$(gcloud secrets versions access latest \
            --secret="lifting-logbook-stg-clerk-secret-key" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}")
          kubectl create secret generic api-secrets \
            --namespace=staging \
            --from-literal=database-url="$DB_URL" \
            --from-literal=clerk-secret-key="$CLERK_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Rollback stuck Helm API release (GKE staging)
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        run: |
          STATUS=$(helm status api --namespace=staging --output=json 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null || echo "not-found")
          if [[ "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-install" || "$STATUS" == "pending-rollback" ]]; then
            echo "Rolling back stuck release: api (status=$STATUS)"
            helm rollback api --namespace=staging || true
          fi
          # Force-delete API pods stuck in Terminating — they block helm --wait on the next upgrade.
          kubectl get pods -n staging -l app=api -o json 2>/dev/null \
            | python3 -c "import sys,json; [print(p['metadata']['name']) for p in json.load(sys.stdin).get('items',[]) if p.get('metadata',{}).get('deletionTimestamp')]" \
            | xargs -r kubectl delete pod --force --grace-period=0 -n staging || true

      - name: Helm deploy API (GKE staging)
        id: helm-deploy-api
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        # GKE Autopilot node provisioning can exceed 10m on cold starts; treat as
        # non-fatal so Cloud Run deploy (the integration-test target) always runs.
        continue-on-error: true
        run: |
          helm upgrade --install api ./infra/kubernetes/charts/api \
            --namespace=staging \
            --values=infra/kubernetes/values/staging-api.yaml \
            --set image.repository="${{ needs.build-images.outputs.ar_repo }}/api" \
            --set image.tag="${{ needs.build-images.outputs.image_tag }}" \
            --set gcp.projectId="${{ vars.GCP_STAGING_PROJECT_ID }}" \
            --set gcp.kmsKeyName="${{ needs.terraform-staging.outputs.kms_key_name }}" \
            --set gcp.serviceAccountEmail="${{ needs.terraform-staging.outputs.api_wi_sa }}" \
            --set env.NODE_ENV=staging \
            --set env.OTEL_EXPORTER_OTLP_ENDPOINT="http://otel-collector:4318" \
            --wait --timeout=10m --force

      - name: Fetch GKE API pod logs on failure
        if: steps.helm-deploy-api.outcome == 'failure'
        run: |
          echo "=== GKE API pod status ==="
          kubectl get pods -n staging -l app=api 2>&1 || true
          POD=$(kubectl get pods -n staging -l app=api \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || true)
          if [[ -n "$POD" ]]; then
            echo "=== Logs for pod: $POD ==="
            kubectl logs -n staging "$POD" --tail=100 2>&1 || true
            echo "=== Events for pod: $POD ==="
            kubectl describe pod -n staging "$POD" 2>&1 | tail -40 || true
          else
            echo "No API pod found — Helm may have failed before pod creation"
          fi

      # NOTE: this step is duplicated verbatim in `deploy-web` below. Both jobs
      # need the gate independently because they run in parallel and either may
      # fire its Cloud Run deploy first. If you change the secret name, the
      # placeholder check, or the output shape here, update the copy in
      # `deploy-web` in the same commit. The duplication is intentional (one
      # extra ~5s Secret Manager call per deploy buys full intra-PR parallelism).
      - name: Check Clerk secret key configured
        id: clerk-check
        run: |
          CLERK_KEY=$(gcloud secrets versions access latest \
            --secret="lifting-logbook-stg-clerk-secret-key" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}")
          if [[ "$CLERK_KEY" == "REPLACE_ME" || -z "$CLERK_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  lifting-logbook-stg-clerk-secret-key is still the placeholder value."
            echo "    Cloud Run deploys are skipped until the key is configured."
            echo "    Follow docs/deploy.md Step 4 to set the staging Clerk secret key."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy API + OTel Collector sidecar to Cloud Run (staging)
        id: deploy-api
        if: steps.clerk-check.outputs.configured == 'true'
        # continue-on-error is retained here (NOT for Cloud SQL flakiness — the
        # #498 diagnosis found none) so a failed revision still lets the log-fetch
        # step below capture the container crash reason; the integration-test gate
        # then fails the run. A "container did not start" here is most likely an
        # image/startup or Artifact Registry issue, not connectivity. See
        # docs/runbooks/staging-ci-flakiness.md.
        continue-on-error: true
        # Sidecar deploy via the shared composite action
        # (.github/actions/deploy-cloud-run-otel-sidecar, #817/#820): describe the live
        # service, ensure the collector config secret, inject the otel-collector sidecar,
        # `gcloud run services replace`. Mirrors the four deploy.yml call sites so per-PR
        # staging runs the SAME 2-container topology it will run once merged (#768/#813),
        # instead of stripping the sidecar back to one container on every PR push. Full
        # rationale — live-manifest derivation (preserving every Terraform-managed field),
        # why `services replace` not `--container`, and the CPU-throttling + invoker-IAM
        # invariants — lives in that action. deploy-api and deploy-web are SEPARATE PARALLEL
        # jobs here; the action's ensure-config `create` is concurrency-safe (#818) so both
        # can ensure the secret without racing. No web_sa input: the api SA already holds
        # project-level secretAccessor (only the web SA needs the per-secret grant).
        uses: ./.github/actions/deploy-cloud-run-otel-sidecar
        with:
          service: lifting-logbook-stg-api
          ingress_container_name: api
          image: ${{ needs.build-images.outputs.ar_repo }}/api:${{ needs.build-images.outputs.image_tag }}
          project: ${{ vars.GCP_STAGING_PROJECT_ID }}
          region: ${{ env.REGION }}
          config_secret: lifting-logbook-stg-otel-collector-config
          otlp_secret: lifting-logbook-stg-otel-otlp-auth-header
          loki_secret: lifting-logbook-stg-otel-loki-auth-header
          otel_mirror_repo: ${{ needs.terraform-staging.outputs.otel_mirror_repo }}

      # Guard against a HOLLOW GREEN (#823). The deploy step above intentionally
      # carries continue-on-error: true (#498 — a failed *revision* must still let
      # the log-fetch step below run and let the integration-test gate, not the
      # deploy step, fail the run). But since #822 moved that step to
      # `uses: ./.github/actions/deploy-cloud-run-otel-sidecar`, a composite-action
      # *load* failure (a manifest/template-validation error — e.g. the
      # `env.REGION`-in-an-input-description bug on #822's first CI run) is ALSO
      # swallowed: deploy-api reports outcome=success while NO revision was submitted
      # and the stale one keeps serving, so the integration tests can pass against
      # old code and the hollow green propagates undetected.
      #
      # This step re-derives ground truth from Cloud Run and hard-fails (no
      # continue-on-error) when the live service is NOT running the just-built image.
      # It runs ONLY on the claimed-success path (outcome == 'success') — exactly
      # where the mask hides — so the outcome == 'failure' runtime-revision case stays
      # owned, unchanged, by the existing cloud_run_api_deployed gate + the log-fetch
      # step below. On the non-image-affecting skip-build path the built tag already
      # equals what serves, so this is a correct no-op, never a false failure. See #823.
      #
      # This step reads spec.template, i.e. what was APPLIED, not what SERVES. Whether traffic
      # is pinned away from the newest revision is checked inside the action itself (its
      # "Verify the newest revision serves 100% of traffic" step, #1042). That check runs only
      # if the action loads, which is exactly the case this step exists to cover.
      - name: Verify API revision actually deployed (staging)
        if: steps.deploy-api.outcome == 'success'
        run: |
          SERVICE="lifting-logbook-stg-api"
          EXPECTED="${{ needs.build-images.outputs.ar_repo }}/api:${{ needs.build-images.outputs.image_tag }}"
          # The image(s) the latest-applied service spec runs (ingress `api` + the otel
          # sidecar). On a hollow green nothing was applied, so this is still the PRIOR
          # revision's image and won't contain the just-built tag.
          # Bounded retry so a transient Cloud Run API blip on this READ doesn't red an
          # otherwise-successful deploy — mirrors the migrate (3-attempt) / terraform apply
          # (2-attempt) / build-push (wretry) pattern this workflow already uses, and the
          # reason its companion runbook (staging-ci-flakiness.md) exists: transients must
          # not produce "re-run goes green" false reds. Only the read is retried; a genuine
          # hollow green (image mismatch) still hard-fails below with no retry.
          LIVE_IMAGES=""
          for attempt in 1 2 3; do
            if LIVE_IMAGES=$(gcloud run services describe "$SERVICE" \
                  --region="${{ env.REGION }}" \
                  --project="${{ vars.GCP_STAGING_PROJECT_ID }}" \
                  --format='value(spec.template.spec.containers[].image)'); then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "describe attempt $attempt failed; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              continue
            fi
            echo "::error title=Staging API deploy unverifiable::deploy-api reported success but '$SERVICE' could not be described after 3 attempts to confirm the deployed image — not trusting this green. See #823 and docs/runbooks/staging-ci-flakiness.md."
            exit 1
          done
          echo "Expected just-built image: $EXPECTED"
          echo "Latest-applied image(s):   $LIVE_IMAGES"
          if printf '%s\n' "$LIVE_IMAGES" | grep -qF "$EXPECTED"; then
            echo "✓ Live service runs the just-built image — real deploy, not a hollow green."
            exit 0
          fi
          # Tag didn't match — fall back to a digest comparison, in case Cloud Run stored
          # the image by digest rather than the tag we passed to `services replace`.
          EXPECTED_DIGEST=$(gcloud artifacts docker images describe "$EXPECTED" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}" \
            --format='value(image_summary.digest)' 2>/dev/null || true)
          if [[ -n "$EXPECTED_DIGEST" ]] && printf '%s\n' "$LIVE_IMAGES" | grep -qF "$EXPECTED_DIGEST"; then
            echo "✓ Live service runs the just-built image by digest ($EXPECTED_DIGEST)."
            exit 0
          fi
          echo "::error title=Staging API deploy is a hollow green::deploy-api reported success but '$SERVICE' is NOT running the just-built image ($EXPECTED${EXPECTED_DIGEST:+ / $EXPECTED_DIGEST}). The OTel-sidecar composite action most likely failed to LOAD (a manifest/template-validation error) and submitted no revision, leaving the stale revision serving. Fix the action manifest — do not trust this green. See #823 and docs/runbooks/staging-ci-flakiness.md."
          exit 1

      # Also runs when the deploy action's "Verify the newest revision serves 100% of traffic" step
      # failed (#1042): then the revision started fine and these crash logs are irrelevant — the
      # cause is the traffic routes printed in that step's ::error annotation (a pin).
      - name: Fetch Cloud Run API logs on failure
        if: steps.deploy-api.outcome == 'failure'
        run: |
          # Cloud Logging ingestion for Cloud Run stdout/stderr typically takes
          # 30-90s after the container writes the logs. Without a delay the query
          # returns before application logs are indexed, showing only infra events.
          echo "Waiting 90s for Cloud Logging ingestion..."
          sleep 90
          echo "=== Cloud Run API crash logs (last 100 lines, all severities) ==="
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="lifting-logbook-stg-api"' \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}" \
            --limit=100 \
            --format="table(timestamp,severity,textPayload,jsonPayload.message)" \
            --order=desc \
            --freshness=10m \
            2>&1 || true

  # ── 3b. Deploy web (staging) ──────────────────────────────────────────────
  deploy-web:
    name: Deploy web (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [preflight, terraform-staging, build-images]
    if: |
      needs.preflight.outputs.should_run == 'true' &&
      needs.build-images.result == 'success'
    permissions:
      contents: read
      id-token: write
    environment: staging
    concurrency:
      group: staging-deploy-mutex-web
      cancel-in-progress: false
    outputs:
      web_url: ${{ steps.deploy-web.outputs.url }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to GCP (staging)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_SERVICE_ACCOUNT }}

      - name: Set up GKE credentials
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ needs.terraform-staging.outputs.gke_cluster_name }}
          location: ${{ env.REGION }}
          project_id: ${{ vars.GCP_STAGING_PROJECT_ID }}

      - name: Set up Helm
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        uses: azure/setup-helm@v4

      - name: Ensure staging namespace
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync web secrets to Kubernetes
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        run: |
          CLERK_PUB=$(gcloud secrets versions access latest \
            --secret="lifting-logbook-stg-clerk-publishable-key" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}")
          kubectl create secret generic web-secrets \
            --namespace=staging \
            --from-literal=clerk-publishable-key="$CLERK_PUB" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Rollback stuck Helm web release (GKE staging)
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        run: |
          STATUS=$(helm status web --namespace=staging --output=json 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null || echo "not-found")
          if [[ "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-install" || "$STATUS" == "pending-rollback" ]]; then
            echo "Rolling back stuck release: web (status=$STATUS)"
            helm rollback web --namespace=staging || true
          fi
          kubectl get pods -n staging -l app=web -o json 2>/dev/null \
            | python3 -c "import sys,json; [print(p['metadata']['name']) for p in json.load(sys.stdin).get('items',[]) if p.get('metadata',{}).get('deletionTimestamp')]" \
            | xargs -r kubectl delete pod --force --grace-period=0 -n staging || true

      - name: Helm deploy web (GKE staging)
        if: needs.terraform-staging.outputs.gke_enabled == 'true'
        continue-on-error: true
        run: |
          # API_URL = cluster-internal (SSR); PUBLIC_API_URL = browser-facing external
          # endpoint injected into window.__PUBLIC_CONFIG__ at runtime (#396 / ADR-028).
          API_CLUSTER_URL="http://api.staging.svc.cluster.local:3000"
          helm upgrade --install web ./infra/kubernetes/charts/web \
            --namespace=staging \
            --values=infra/kubernetes/values/staging-web.yaml \
            --set image.repository="${{ needs.build-images.outputs.ar_repo }}/web" \
            --set image.tag="${{ needs.build-images.outputs.image_tag }}" \
            --set gcp.projectId="${{ vars.GCP_STAGING_PROJECT_ID }}" \
            --set env.NODE_ENV=staging \
            --set env.API_URL="$API_CLUSTER_URL" \
            --set env.PUBLIC_API_URL="${{ needs.terraform-staging.outputs.cloud_run_api_url }}" \
            --set env.OTEL_EXPORTER_OTLP_ENDPOINT="http://otel-collector:4318" \
            --wait --timeout=10m

      # NOTE: this step is duplicated verbatim from `deploy-api` above. See the
      # comment there for the rationale; keep the two copies in sync.
      - name: Check Clerk secret key configured
        id: clerk-check
        run: |
          CLERK_KEY=$(gcloud secrets versions access latest \
            --secret="lifting-logbook-stg-clerk-secret-key" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}")
          if [[ "$CLERK_KEY" == "REPLACE_ME" || -z "$CLERK_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy web + OTel Collector sidecar to Cloud Run (staging)
        id: deploy-web-sidecar
        if: steps.clerk-check.outputs.configured == 'true'
        # Sidecar deploy via the shared composite action
        # (.github/actions/deploy-cloud-run-otel-sidecar, #817/#820), mirroring the api step
        # above and deploy.yml's web call sites: describe → ensure config secret → inject the
        # otel-collector sidecar → `gcloud run services replace`. Same 2-container topology,
        # collector config, and Grafana endpoint/auth-header secrets as the api step; only the
        # ingress container name (web) and image differ. @vercel/otel (apps/web/instrumentation.ts)
        # exports OTLP to localhost:4318, so without the co-located collector every web-server
        # span is dropped — the #206 request traces AND the #798 client.mutation.error spans.
        # The web service's env/secrets and SA are Terraform-managed (ignore_changes = [template])
        # and preserved verbatim by describe; its public posture stays owned by Terraform's allUsers
        # run.invoker binding (services replace never touches invoker IAM). web_sa drives the
        # action's least-privilege grant of exactly the three otel secrets to the WEB workload SA —
        # which, unlike the api SA's project-level accessor, holds only per-secret Clerk grants
        # (#804), so the internet-facing web SA never gains the api SA's broad access to
        # DATABASE_URL / migrator creds. deploy-api and deploy-web run as SEPARATE PARALLEL jobs;
        # the action's ensure-config `create` is concurrency-safe (#818). Full rationale
        # (live-manifest derivation, CPU-throttling + invoker-IAM invariants) lives in that action.
        uses: ./.github/actions/deploy-cloud-run-otel-sidecar
        with:
          service: lifting-logbook-stg-web
          ingress_container_name: web
          image: ${{ needs.build-images.outputs.ar_repo }}/web:${{ needs.build-images.outputs.image_tag }}
          project: ${{ vars.GCP_STAGING_PROJECT_ID }}
          region: ${{ env.REGION }}
          config_secret: lifting-logbook-stg-otel-collector-config
          otlp_secret: lifting-logbook-stg-otel-otlp-auth-header
          loki_secret: lifting-logbook-stg-otel-loki-auth-header
          otel_mirror_repo: ${{ needs.terraform-staging.outputs.otel_mirror_repo }}
          web_sa: ${{ needs.terraform-staging.outputs.web_workload_sa }}

      # web_url for the integration-test + report-status jobs. `gcloud run services replace`
      # (unlike `gcloud run deploy`) emits no "Service URL:" line, so source the canonical service
      # URL from the Terraform output (the same value deploy.yml's smoke test probes). This is a
      # separate step because the composite action above `uses:` an action and so cannot also `run:`
      # a script to set the output. The `if:` carries no status-check function, so GitHub prepends
      # an implicit success() — this step runs only when the clerk gate passed AND the sidecar
      # replace above succeeded, preserving the prior "url set ⇒ deploy succeeded" semantics. id
      # stays `deploy-web` so the job output `web_url: steps.deploy-web.outputs.url` is unchanged.
      - name: Publish staging web URL
        id: deploy-web
        if: steps.clerk-check.outputs.configured == 'true'
        run: echo "url=${{ needs.terraform-staging.outputs.cloud_run_web_url }}" >> "$GITHUB_OUTPUT"

  # ── 4. Staging integration tests ─────────────────────────────────────────
  staging-integration-tests:
    name: Staging Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [preflight, terraform-staging, deploy-api, deploy-web]
    # Only skip when staging is not configured at all (no GCP credentials).
    # When staging IS configured, always() ensures the job runs even when a
    # needs job hard-fails (e.g. GCP auth failure in deploy-api/deploy-web) —
    # without it GitHub Actions auto-skips dependents on failure, which branch
    # protection treats as passing and silently bypasses the merge gate. See #345.
    if: always() && needs.preflight.outputs.should_run == 'true'
    permissions:
      contents: read
      id-token: write
    # environment: staging grants access to environment-level secrets
    # (STAGING_CLERK_TEST_EMAIL, STAGING_CLERK_TEST_PASSWORD).
    environment: staging

    steps:
      - name: Verify deploy prerequisites
        run: |
          # deploy-api.result is the source of truth for "did the job deliver its outputs".
          # The integration-tests job runs under `if: always()` (see #345), so deploy-api
          # can reach this step in any of three non-success states:
          #   - skipped/cancelled: upstream build-images failed (per deploy-api's `if:` guard).
          #   - failure: deploy-api ran but a step errored (e.g., GCP auth, Cloud Run deploy).
          # In all three, `clerk_configured` and `cloud_run_api_deployed` may be empty rather
          # than 'false', so a plain `clerk_configured != 'true'` check mis-reports any of
          # them as a Clerk misconfiguration. See #398 / PR #395 for the motivating incident.
          DEPLOY_RESULT='${{ needs.deploy-api.result }}'
          CLERK_OUT='${{ needs.deploy-api.outputs.clerk_configured }}'
          API_DEPLOYED='${{ needs.deploy-api.outputs.cloud_run_api_deployed }}'

          if [[ "$DEPLOY_RESULT" != "success" ]]; then
            echo "::error::deploy-api did not succeed (result: $DEPLOY_RESULT). If 'skipped' or 'cancelled', build-images likely failed — check the 'Build & Push Images' job (e.g., Artifact Registry 504 on layer-blob push) and re-run failed jobs if transient. If 'failure', open the Deploy API (staging) job log for the step that errored (commonly GCP auth or the Cloud Run deploy itself)."
            exit 1
          fi
          if [[ "$CLERK_OUT" != "true" ]]; then
            echo "::error::Staging Clerk secret key is not configured. Follow docs/deploy.md Step 4 to set lifting-logbook-stg-clerk-secret-key in GCP Secret Manager, then re-run CI."
            exit 1
          fi
          if [[ "$API_DEPLOYED" != "true" ]]; then
            echo "::error::Cloud Run API deploy failed — integration tests cannot run. Open the Deploy API (staging) job and see which step failed. If it was 'Verify the newest revision serves 100% of traffic', traffic is pinned to an older revision — see its annotation and docs/runbooks/deploy-regression-rollback.md (#1042). Otherwise check the 'Fetch Cloud Run API logs on failure' step (commonly an image/startup error or an Artifact Registry push issue — not Cloud SQL connectivity, per the #498 diagnosis). See docs/runbooks/staging-ci-flakiness.md."
            exit 1
          fi
          # deploy-web's Cloud Run deploy has no continue-on-error, so a failure there (including
          # the #1042 serving check) fails the job and leaves web_url empty. Fail fast with that
          # cause instead of polling an empty URL into "Staging did not become ready in time".
          WEB_RESULT='${{ needs.deploy-web.result }}'
          if [[ "$WEB_RESULT" != "success" ]]; then
            echo "::error::deploy-web did not succeed (result: $WEB_RESULT) — integration tests cannot run. If 'cancelled', a newer PR's staging deploy most likely preempted it in the staging-deploy-mutex-web queue — re-run the failed jobs (see CLAUDE.md 'Staging-deploy queue starvation', #673). If 'failure', open the Deploy web (staging) job for the step that failed; if it was 'Verify the newest revision serves 100% of traffic', traffic is pinned to an older revision (see docs/runbooks/deploy-regression-rollback.md, #1042)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium

      - name: Authenticate to GCP (staging) for Secret Manager access
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_SERVICE_ACCOUNT }}

      - name: Wait for staging to be ready
        id: wait-ready
        run: |
          WEB_URL="${{ needs.deploy-web.outputs.web_url }}"
          # Clerk dev-mode (pk_test_ key) rewrites the first unauthenticated request
          # to an internal /clerk_<hash> path for dev-browser cookie initialization.
          # That path has no Next.js page → 404. The app IS running; the reliable
          # readiness signal is the x-powered-by: Next.js response header, which
          # is present on every response from the Next.js server regardless of
          # auth state or Clerk mode (dev vs prod).
          for i in $(seq 1 18); do
            HEADERS=$(curl -s -D - -o /dev/null "${WEB_URL}/" || true)
            if echo "$HEADERS" | grep -qi "x-powered-by: Next.js"; then
              echo "Staging web is up — Next.js is responding (attempt $i)."
              exit 0
            fi
            STATUS=$(echo "$HEADERS" | head -1 | grep -o '[0-9]\{3\}' | head -1)
            echo "Attempt $i: got ${STATUS:-no-response} (no Next.js header), retrying in 10s..."
            sleep 10
          done
          echo "Staging did not become ready in time" && exit 1

      - name: Fetch Cloud Run web logs on failure
        if: failure() && steps.wait-ready.outcome == 'failure'
        run: |
          echo "Waiting 30s for Cloud Logging ingestion..."
          sleep 30
          echo "=== Cloud Run web service logs (last 50 lines, all severities) ==="
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="lifting-logbook-stg-web"' \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}" \
            --limit=50 \
            --format="table(timestamp,severity,textPayload,jsonPayload.message)" \
            --order=desc \
            --freshness=10m \
            2>&1 || true

      - name: Fetch staging Clerk secrets
        run: |
          CLERK_SECRET_KEY=$(gcloud secrets versions access latest \
            --secret="lifting-logbook-stg-clerk-secret-key" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}")
          echo "::add-mask::$CLERK_SECRET_KEY"
          echo "CLERK_SECRET_KEY=$CLERK_SECRET_KEY" >> "$GITHUB_ENV"

          # @clerk/testing clerkSetup() requires CLERK_PUBLISHABLE_KEY (no NEXT_PUBLIC_ prefix)
          CLERK_PUBLISHABLE_KEY=$(gcloud secrets versions access latest \
            --secret="lifting-logbook-stg-clerk-publishable-key" \
            --project="${{ vars.GCP_STAGING_PROJECT_ID }}")
          echo "CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Run staging integration tests
        working-directory: apps/web
        run: npx playwright test --config=playwright.config.staging.ts
        env:
          CI: 'true'
          STAGING_WEB_URL: ${{ needs.deploy-web.outputs.web_url }}
          STAGING_API_URL: ${{ needs.terraform-staging.outputs.cloud_run_api_url }}
          STAGING_CLERK_TEST_EMAIL: ${{ secrets.STAGING_CLERK_TEST_EMAIL }}
          STAGING_CLERK_TEST_PASSWORD: ${{ secrets.STAGING_CLERK_TEST_PASSWORD }}
          # CLERK_SECRET_KEY is set in GITHUB_ENV by the fetch step above

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-playwright-report
          path: apps/web/playwright-report/

  # ── 5. Report status (PR comment) ────────────────────────────────────────
  report-status:
    name: Report Staging Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [preflight, terraform-staging, deploy-api, deploy-web, staging-integration-tests]
    # No PR to comment on under merge_group (context.issue.number is undefined
    # there), and this job isn't a required check — skip it entirely (#694).
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Post staging result comment
        uses: actions/github-script@v9
        with:
          script: |
            const shouldRun = '${{ needs.preflight.outputs.should_run }}' === 'true';
            const testResult = '${{ needs.staging-integration-tests.result }}';
            const deployApiResult = '${{ needs.deploy-api.result }}';
            const webUrl = '${{ needs.deploy-web.outputs.web_url }}';

            let body;
            const clerkConfigured = '${{ needs.deploy-api.outputs.clerk_configured }}' === 'true';
            const cloudRunApiDeployed = '${{ needs.deploy-api.outputs.cloud_run_api_deployed }}' === 'true';
            // Any non-success deployApiResult means the deploy-api job didn't deliver
            // its outputs cleanly — skipped/cancelled (upstream build-images failed) or
            // failure (an internal step errored, e.g., GCP auth). In all of these,
            // clerkConfigured and cloudRunApiDeployed default to false because the
            // outputs are empty strings, so we surface the upstream state explicitly
            // rather than mis-reporting it as a Clerk-secret misconfiguration —
            // see #398 / PR #395.
            if (!shouldRun) {
              body = '⚪ **Staging skipped** — `GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER` is not configured.';
            } else if (deployApiResult !== 'success') {
              const upstreamHint = (deployApiResult === 'skipped' || deployApiResult === 'cancelled')
                ? 'likely because `build-images` failed'
                : 'a step in deploy-api errored (commonly GCP auth or the Cloud Run deploy itself)';
              body = `⚠️ **Staging integration tests did not run** — \`deploy-api\` result was \`${deployApiResult}\`; ${upstreamHint}. Open the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and re-run failed jobs if the failure was transient (e.g., Artifact Registry 504 on layer-blob push).`;
            } else if (!clerkConfigured) {
              body = '⚠️ **Staging integration tests skipped** — `lifting-logbook-stg-clerk-secret-key` in GCP Secret Manager is still the placeholder value. Follow [docs/deploy.md Step 4](https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/docs/deploy.md#step-4--sign-up-for-clerk-and-create-two-apps) to configure the staging Clerk secret key, then re-run CI.';
            } else if (!cloudRunApiDeployed) {
              body = `⚠️ **Staging integration tests skipped** — Cloud Run API deploy failed. If the failing step in the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) is "Verify the newest revision serves 100% of traffic", traffic is pinned to an older revision (see \`docs/runbooks/deploy-regression-rollback.md\`, #1042). Otherwise check the "Fetch Cloud Run API logs on failure" step for the crash reason — commonly an image/startup error or an Artifact Registry push issue, not Cloud SQL connectivity (see the [#498](https://github.com/${{ github.repository }}/issues/498) diagnosis and \`docs/runbooks/staging-ci-flakiness.md\`).`;
            } else if (testResult === 'success') {
              body = `✅ **Staging integration tests passed**\n\n🔗 [Staging environment](${webUrl})`;
            } else if (testResult === 'failure') {
              body = `❌ **Staging integration tests failed** — see the [Playwright report artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\n🔗 [Staging environment](${webUrl})`;
            } else {
              body = `⚠️ **Staging integration tests did not run** (status: ${testResult})`;
            }

            // Find and update an existing bot comment, or create a new one.
            // Paginate: listComments returns only the first 30 by default, so on a
            // chatty PR (>30 comments) the sticky staging-result comment could fall
            // off page 1 and we'd stack a duplicate on every re-push instead of
            // updating in place. github.paginate walks every page. Mirrors the fix
            // in prod-plan-pr.yml (#559).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            // Bot-guard BOTH arms. Without the parentheses, JS operator precedence
            // makes this `(Bot && integration-tests) || skipped`, so any comment —
            // including a human's — whose body contains "Staging skipped" would match
            // and be overwritten by the status updater. The skipped-state sticky
            // comment body is `⚪ **Staging skipped** …` (no "integration tests"
            // substring), so that arm is required to find it — it just needs to be
            // scoped to bot-authored comments. (#564)
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body &&
              (c.body.includes('Staging integration tests') || c.body.includes('Staging skipped'))
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
